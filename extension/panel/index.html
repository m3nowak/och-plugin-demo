<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rat</title>
    <style>
      :root {
        color-scheme: light dark;
        background: var(--oc-bg, Canvas);
        color: var(--oc-fg, CanvasText);
        font-family: var(--oc-font, system-ui, sans-serif);
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--oc-bg, Canvas);
        color: var(--oc-fg, CanvasText);
      }

      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      .stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1rem;
        text-align: center;
        color: var(--oc-fg, CanvasText);
      }

      .message[hidden] {
        display: none;
      }

      .attribution {
        flex: 0 0 auto;
        margin: 0;
        padding: 0.5rem 0.75rem 0.75rem;
        font-size: 0.75rem;
        line-height: 1.4;
        color: var(--oc-muted, GrayText);
      }

      .attribution a {
        color: var(--oc-primary-text, LinkText);
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <canvas id="scene" role="img" aria-label="The Low Poly Rat model rotating slowly"></canvas>
      <p class="message" id="message" role="alert" hidden></p>
    </div>
    <p class="attribution" id="attribution">
      “<a href="https://sketchfab.com/3d-models/low-poly-rat-dd63402df69742e39e989801f282e58a" target="_blank" rel="noopener noreferrer">Low Poly Rat</a>”
      by <a href="https://sketchfab.com/tylerlazzareschi" target="_blank" rel="noopener noreferrer">Tyler Lazzareschi</a>,
      licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>.
      Converted from FBX and textured for this panel.
    </p>
    <script src="./main.js"></script>
  </body>
</html>
